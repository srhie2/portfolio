<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta | Sungsan Rhie</title>

  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../global.js"></script>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <h1>Meta</h1>
  <p>This page shows statistics about the code of my portfolio website.</p>

  <div class="commit-filter">
  <label for="commit-progress">Show commits until:</label>

  <input
    type="range"
    id="commit-progress"
    min="0"
    max="100"
    value="100"
  >

  <time id="commit-cutoff-time"></time>
</div>

  <div id="stats"></div>
  <h2>Commits over time</h2>
<p>Scroll through the descriptions to see how my portfolio developed.</p>

<div id="scrolly-1">
  <div id="scatter-story"></div>

  <div id="scatter-plot">
    <div id="chart"></div>
    <p id="selection-count">No commits selected</p>
    <dl id="language-breakdown" class="stats"></dl>
  </div>
</div>
<dl id="commit-tooltip" class="info tooltip" hidden>
  <dt>Commit</dt>
  <dd><a id="commit-link" target="_blank"></a></dd>

  <dt>Date</dt>
  <dd id="commit-date"></dd>

  <dt>Time</dt>
  <dd id="commit-time"></dd>

  <dt>Author</dt>
  <dd id="commit-author"></dd>

  <dt>Lines</dt>
  <dd id="commit-lines"></dd>
</dl>
<h2>Files by line count</h2>
<p>Each dot represents one line of code. Colors show code types.</p>

<dl id="files"></dl>
</body>
</html>
